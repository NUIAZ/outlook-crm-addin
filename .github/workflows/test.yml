# Runs the 56 tests on every push and PR: matching, actions, store, the
# Office.js seam through a stub, the pane end to end in both hosts, and the
# manifest checks that stand in for Exchange's sideload-time validation.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Microsoft's own manifest validation (schema + acceptance service). This is
      # the check that catches what unit tests cannot: Exchange rejecting the XML
      # at sideload time with an unhelpful client-side error. SupportsPinning in
      # the wrong VersionOverrides version was found exactly this way.
      - run: npx --yes office-addin-manifest validate public/manifest.xml
